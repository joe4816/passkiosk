<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5d2da1">
  <meta name="color-scheme" content="light">
  <title>PassKiosk</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/passkiosk-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/jsQR.js"></script>
  <script defer src="config.js"></script>
  <script defer src="bridge.js"></script>
  <script defer src="js/app-core.js"></script>
  <script defer src="js/app-email.js"></script>
  <script defer src="js/app-pass-request.js"></script>
  <script defer src="js/app-class-routing.js"></script>
  <script defer src="js/app-detention-settings.js"></script>
  <script defer src="js/app-camera-utils.js"></script>
</head>
<body>
<div id="front" class="screen">
    <div class="front-card">
      <div class="brand">PassKiosk</div>
      <div class="muted">Ernest A. Becker Sr. Middle School</div>
      <div id="identityLoadingPane">
        <div class="front-title">Signing you in…</div>
        <div class="muted">Checking your CCSD account.</div>
      </div>
      <div id="identifyPane" class="hidden">
        <div class="front-title">Who are you?</div>
        <input id="usernameInput" class="front-input" autocomplete="off" autocapitalize="characters" placeholder="CCSD username" onkeydown="if(event.key==='Enter') identifyUser()">
        <div class="submit-row"><button class="primary" onclick="identifyUser()">Continue</button></div>
      </div>
      <div id="printerPane" class="hidden">
        <div class="welcome"><span id="welcomeText">Welcome</span><button id="changeUserButton" class="recycle hidden" title="Change user" onclick="resetFrontDoor()">🔄</button></div>
        <div id="outputPrompt" class="front-title">Where do you want to print?</div>
        <div id="frontPrinters"></div>
      </div>
    </div>
  </div>

  <div id="app" class="screen hidden">
    <div class="topbar">
      <div class="nav">
        <button data-lane="PASS" aria-label="Corridor Pass" aria-pressed="false" onclick="selectLane('PASS')">Corridor</button>
        <button data-lane="RQST" aria-label="Student request" aria-pressed="false" onclick="selectLane('RQST')">Request</button>
        <button data-lane="DET" aria-label="After-school detention" aria-pressed="false" onclick="selectLane('DET')">Det</button>
        <button data-lane="LUNCH_DET" aria-label="Lunch detention" aria-pressed="false" onclick="selectLane('LUNCH_DET')">🥪Det</button>
        <button data-lane="BUS" aria-label="Activity bus" aria-pressed="false" onclick="selectLane('BUS')">🚌</button>
        <button data-lane="SETTINGS" aria-label="Settings" aria-pressed="false" onclick="selectLane('SETTINGS')">⚙️</button>
      </div>
      <div class="context-strip"><span id="contextUser"></span><span id="contextPrinter"></span></div>
    </div>
    <div class="wrap"><div id="emailDeliveryNotice" class="hidden" role="status" aria-live="polite"></div><div id="workspace" class="pick-lane">↑ Pick a lane</div></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Resend print job?</div>
      <div id="confirmText"></div>
      <div class="submit-row"><button class="secondary" onclick="closeConfirm()">Cancel</button><button class="primary" onclick="confirmReprint()">Send</button></div>
    </div>
  </div>

  <div id="cameraModal" class="modal camera-modal hidden" role="dialog" aria-modal="true" aria-label="Scan student QR">
    <div class="camera-card">
      <div class="camera-head"><strong>Scan Student QR</strong><button class="camera-done" onclick="closeCamera()">Done</button></div>
      <div class="camera-controls"><label for="cameraSelect">Camera</label><select id="cameraSelect" class="field" onchange="switchCamera(this.value)" disabled><option value="">Starting camera…</option></select><span id="cameraChoiceNote" class="small"></span></div>
      <video id="cameraVideo" playsinline muted></video>
      <canvas id="cameraCanvas" class="hidden"></canvas>
      <div class="camera-foot"><span id="cameraStatus">Point the camera at the student QR code.</span><span id="cameraCount"></span></div>
    </div>
  </div>
</body>
</html>
